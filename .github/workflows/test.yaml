name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install open EDA tools (yosys, iverilog, nextpnr-ice40)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: run the suite
        run: python3 tests.py

      - name: locate icestorm data on this runner (issue #12 diagnostic)
        if: failure()
        run: |
          W=$(which icebox_vlog); echo "icebox_vlog: $W"; head -1 "$W" || true
          R=$(dirname $(dirname "$W")); echo "prefix: $R"
          find "$R" -maxdepth 4 \( -name 'chipdb*' -o -name 'icebox.py' \) 2>/dev/null | head -20
          python3 -c "import icebox" 2>&1 | head -2

      - name: rerun the bitstream flow verbosely on failure (issue #12)
        if: failure()
        run: python3 bitstream.py --block mac || true

      - name: upload flow outputs on failure (see issue #12)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            bitstream_*.json
            build/
            build_sweep/
            report*.json
          if-no-files-found: ignore
