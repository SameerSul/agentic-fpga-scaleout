name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install open EDA tools (yosys, iverilog, nextpnr-ice40)
        uses: YosysHQ/setup-oss-cad-suite@v3

      - name: run the suite
        run: python3 tests.py
